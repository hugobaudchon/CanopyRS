components_configs:
  - tilerizer:
      tile_type: tile
      tile_size: 1333
      tile_overlap: 0.75
      ground_resolution: 0.06
  - detector: detectors/dino_r50_single_S.yaml
  - aggregator:
      nms_algorithm: 'iou'
      score_threshold: 0.4
      nms_threshold: 0.55
      edge_band_buffer_percentage: 0.05
      scores_weights: { 'detector_score': 1.0 }
  - tilerizer:
      tile_type: polygon
      tile_size: 512
      scale_factor: 1.0
